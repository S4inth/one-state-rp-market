<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | ONE STATE RP MARKET</title><style>body{background:#0b1220;color:#e9f4ff;font:16px Arial,sans-serif;margin:0}main{max-width:980px;margin:auto;padding:28px 16px}h1{color:#55dfb7}input,button{font:inherit;padding:12px;border-radius:9px;margin:5px 4px 5px 0}input{background:#1b293e;color:white;border:1px solid #51627a;max-width:100%;box-sizing:border-box}button{background:#55dfb7;border:0;cursor:pointer;font-weight:bold}button:disabled{opacity:.5}article{background:#182438;border:1px solid #35465e;padding:18px;border-radius:14px;margin:14px 0;overflow-wrap:anywhere}p{line-height:1.5}small{color:#bdcadb}.danger{background:#ffb0b0}#logout{background:#cbd5e1}#message{white-space:pre-wrap}</style></head><body><main><h1>ONE STATE RP MARKET • Administração</h1><p>Entre com seu usuário administrador do Supabase. Confirme o PIX de R$ 2,00 no banco antes de aprovar.</p><section id="login"><input id="email" type="email" autocomplete="username" placeholder="E-mail" aria-label="E-mail"><input id="password" type="password" autocomplete="current-password" placeholder="Senha" aria-label="Senha"><button id="enter">Entrar</button></section><section id="panel" hidden><button id="refresh">Atualizar pendentes</button><button id="logout">Sair</button><h2>Anúncios pendentes</h2><div id="ads"></div></section><p id="message" role="status"></p></main><script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const cfg=window.MARKET_CONFIG||{};const msg=document.getElementById('message');const panel=document.getElementById('panel');const login=document.getElementById('login');const ads=document.getElementById('ads');let client;
if(!cfg.supabaseUrl||!cfg.supabaseAnonKey){msg.textContent='Configure supabaseUrl e supabaseAnonKey em config.js.'}else{client=window.supabase.createClient(cfg.supabaseUrl,cfg.supabaseAnonKey)}
function say(s){msg.textContent=s}function el(tag,text){const e=document.createElement(tag);e.textContent=text;return e}
async function refresh(){ads.replaceChildren();say('Carregando...');const {data,error}=await client.rpc('market_list_pending');if(error){say('Sem acesso aos anúncios: '+error.message);return}say(data.length+' anúncio(s) pendente(s).');for(const a of data){const card=el('article','');card.append(el('h3',a.titulo),el('p',a.descricao),el('p','Categoria: '+a.categoria+' | Cidade: '+a.cidade+' | Preço RP: '+a.preco),el('p','Jogador: '+a.nome+' | Contato: '+a.contato),el('small','ID: '+a.id+' | '+a.criado_em));for(const [label,status] of [['Aprovar (PIX confirmado)','aprovado'],['Rejeitar','rejeitado']]){const b=el('button',label);if(status==='rejeitado')b.className='danger';b.onclick=async()=>{if(!confirm(status==='aprovado'?'Você confirmou o PIX no aplicativo do banco e revisou o anúncio?':'Rejeitar este anúncio?'))return;b.disabled=true;const {data,error}=await client.rpc('market_moderate',{ad_id:a.id,new_status:status});if(error||!data){say(error?.message||'Anúncio não atualizado');b.disabled=false;return}await refresh()};card.append(b)}ads.append(card)}}
async function sync(){const {data}=await client.auth.getSession();const signed=!!data.session;panel.hidden=!signed;login.hidden=signed;if(signed)await refresh()}
document.getElementById('enter').onclick=async()=>{if(!client)return;const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;const {error}=await client.auth.signInWithPassword({email,password});document.getElementById('password').value='';if(error){say('Login não realizado: '+error.message);return}await sync()};document.getElementById('refresh').onclick=refresh;document.getElementById('logout').onclick=async()=>{await client.auth.signOut();ads.replaceChildren();say('Sessão encerrada');await sync()};if(client)sync();
</script></body></html>
